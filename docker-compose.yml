services:
  app:
    image: ghcr.io/astynomus/familiar:latest
    build: .
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN}}
      MASTER_SECRET: ${MASTER_SECRET:?Set MASTER_SECRET to a random secret of at least 32 characters}
    volumes:
      - familiar_data:/data
    ports:
      - '127.0.0.1:${PORT:-3000}:${PORT:-3000}'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public hostname}
      PORT: ${PORT:-3000}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  familiar_data:
  caddy_data:
  caddy_config:
